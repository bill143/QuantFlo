name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  quality:
    name: lint · type-check · test
    runs-on: ubuntu-latest

    env:
      # Point settings at the service containers (pydantic reads QUANTFLO_* from env).
      QUANTFLO_DATABASE_URL: postgresql+asyncpg://quantflo:quantflo_local_dev@localhost:5432/quantflo
      QUANTFLO_REDIS_URL: redis://localhost:6379/0
      QUANTFLO_TENANT_ID: local

    services:
      postgres:
        image: timescale/timescaledb:2.17.2-pg16
        env:
          POSTGRES_USER: quantflo
          POSTGRES_PASSWORD: quantflo_local_dev
          POSTGRES_DB: quantflo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quantflo -d quantflo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7.4.1-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies (locked)
        run: uv sync --frozen --all-extras --python 3.11

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type-check (mypy)
        run: uv run mypy

      - name: Apply database migrations
        run: uv run alembic upgrade head

      - name: Test (pytest + coverage)
        run: uv run pytest --cov=quantflo --cov-report=term-missing

      - name: Boot swarm — in-memory bus (entrypoint smoke)
        run: uv run python scripts/boot_swarm.py

      - name: Boot swarm — Redis-backed bus (gate E smoke)
        run: uv run python scripts/boot_swarm.py --bus redis
