# QUANTFLO local datastore — Postgres+TimescaleDB + Redis (pinned versions).
# Single-tenant/personal dev stack. Run from repo root:
#   docker compose -f infra/docker/docker-compose.yml --env-file .env up -d
name: quantflo

services:
  postgres:
    image: timescale/timescaledb:2.17.2-pg16
    container_name: quantflo-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-quantflo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quantflo_local_dev}
      POSTGRES_DB: ${POSTGRES_DB:-quantflo}
    ports:
      - "15432:5432"   # host 15432 (avoids conflicts with other local Postgres on 5432/5433)
    volumes:
      - quantflo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-quantflo} -d ${POSTGRES_DB:-quantflo}"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7.4.1-alpine
    container_name: quantflo-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "16379:6379"   # host 16379 (avoids conflict with other local Redis on 6379)
    volumes:
      - quantflo_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

volumes:
  quantflo_pgdata:
  quantflo_redisdata:
